# Template identity
name: "forge-ai-mvp"
version: "v1.0.0"
description: "Minimal viable Forge AI template for MVP demonstration"

# Components included in this template
components:
  ai_functions:
    - planning/DISCOVER.ai.md
    - planning/PLAN.ai.md
    - planning/ASSESS.ai.md
    - implementation/EXECUTE.ai.md
    - validation/VALIDATE.ai.md
    - validation/REPORT.ai.md

  schemas:
    - project.cue
    - task.cue

# MCP tools shipped by template (specification)
tools:
  core:
    - next
    - artifact_save
    - step_start
    - step_complete
  planning:
    - step_add

# Task templates shipped by template (declarations)
templates:
  tasks:
    default: "default.yaml"
    available:
      - name: "default"
        file: "default.yaml"
        description: "Standard three-phase workflow"

# Optional metadata
author: "Catalyst Forge Team"
license: "MIT"